org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler memory-maps its .tab caches and, on Windows,
# regularly fails to release them: "Could not close incremental caches in
# ...\caches-jvm\jvm\kotlin". It struck a different plugin module on each run
# (record_android, then audio_session) and survived a full `flutter clean`, so
# it is not stale state. Incremental compilation buys nothing on a release
# build anyway.
kotlin.incremental=false
