name: noise_alert
description: Flightpath Watch Report, for logging aircraft noise events and generating complaint emails.
publish_to: "none"
version: 1.1.1+20

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod:
  # audio capture (raw PCM stream) and playback of the saved clip
  record:
  just_audio:
  # location and device metadata. `record` and `geolocator` each request their
  # own runtime permission, so permission_handler is not needed; it also pins a
  # compileSdk that no longer exists as a plain platform (see LESSONS_LEARNT).
  geolocator:
  device_info_plus:
  package_info_plus:
  # storage
  sqflite:
  path_provider:
  path:
  # the OpenSky client secret, and nothing else: Keystore on Android, Keychain
  # on iOS, so it is not in the database file the rest of the settings are in.
  # Held at 10.x on purpose: 11.x needs compileSdk 37, which needs an Android
  # Gradle Plugin newer than the one Flutter 3.47 ships with, and the whole
  # toolchain is not worth moving for one keystore entry. Revisit when Flutter's
  # own default compileSdk passes 36.
  flutter_secure_storage: ^10.0.0
  # networking
  http:
  # mail
  flutter_email_sender:
  url_launcher:
  # formatting
  intl:
  maplibre_gl: ^0.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
